apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: local-demo
  namespace: argocd
spec:
  description: "Minimal RAM local project"
  sourceRepos:
    - 'https://github.com/syahnetwork/argocd-minimal.git' # CHANGE THIS
  destinations:
    - namespace: 'demo'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: 'apps'
      kind: Deployment
    - group: ''
      kind: Service